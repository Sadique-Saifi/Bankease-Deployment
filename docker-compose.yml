version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
